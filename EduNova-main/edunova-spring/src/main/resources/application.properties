spring.application.name=edunova-spring
spring.profiles.active=prod
server.port=${PORT:8080}

# Configuración para Base de Datos H2 (En Memoria)
spring.datasource.url=jdbc:h2:mem:edunovadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.thymeleaf.cache=false

# Habilitar la Consola Web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Valores por defecto locales para evitar errores si las variables no existen
app.admin.password=${ADMIN_PASSWORD:admin123}
app.entrenador.password=${ENTRENADOR_PASSWORD:entrenador123}

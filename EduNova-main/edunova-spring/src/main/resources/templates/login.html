<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - EduNova</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="container container-sm">
        <div class="header-bar" style="justify-content: center; text-align: center; border: none;">
            <h1 style="margin-bottom: 5px;">EduNova</h1>
        </div>
        <h2 style="text-align: center; margin-bottom: 25px; font-size: 1.4rem;">Iniciar sesión</h2>

        <div th:if="${param.error}" style="color: #dc2626; background-color: #fee2e2; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            Usuario o contraseña incorrectos
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required placeholder="Ingrese su usuario">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
            </div>

            <div class="actions-bar" style="margin-top: 25px;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </div>
            <!-- Enlace al Portal de Capacitaciones -->
        <div style="text-align: center; margin-top: 20px;">
            <a th:href="@{/capacitaciones}" style="color: #1B2A52; font-weight: 600; text-decoration: none; font-size: 0.95rem;">
                📚 Ver Portal de Capacitación
            </a>
        </div>
        </form>
    </div>
</body>
</html>
